name: Build Docker Image on EC2

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout repository
      - name: Checkout code
        uses: actions/checkout@v3

      # Step 2: Install SSH client
      - name: Install SSH client
        run: sudo apt-get install -y openssh-client

      # Step 3: Store SSH key in ~/.ssh/deploy_key
      - name: Add SSH key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.AWS_SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      # ✅ Debug SSH key in workflow logs (NOT inside EC2 server)
      - name: Debug SSH key (masked by GitHub automatically)
        run: |
          echo "===== SSH KEY LOADED FROM SECRET ====="
          echo "${{ secrets.AWS_SSH_PRIVATE_KEY }}"
          echo "======================================"

      # Step 4: Add EC2 to known_hosts to avoid SSH prompt
      - name: Add EC2 host to known_hosts
        env:
          AWS_EC2_HOST: ${{ secrets.AWS_EC2_HOST }}
        run: ssh-keyscan -H $AWS_EC2_HOST >> ~/.ssh/known_hosts

      # Step 5: SSH into EC2, build Docker image, push to DockerHub
      - name: SSH to EC2 and Build Docker Image
        env:
          AWS_EC2_USER: ${{ secrets.AWS_EC2_USER }}
          AWS_EC2_HOST: ${{ secrets.AWS_EC2_HOST }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/deploy_key $AWS_EC2_USER@$AWS_EC2_HOST << 'EOF'
            sudo apt-get update
            sudo apt-get install -y docker.io git

            sudo systemctl enable docker
            sudo systemctl start docker

            mkdir -p /home/ubuntu/frontend-code
            cd /home/ubuntu/frontend-code

            if [ -d ".git" ]; then
              git pull origin main
            else
              git clone https://github.com/aashmanarora14/frontend-code .
            fi

            sudo docker build -t my-app-image .

            echo "$DOCKERHUB_TOKEN" | sudo docker login -u "$DOCKERHUB_USERNAME" --password-stdin
            sudo docker tag my-app-image:latest aashman1414/my-app-image:latest
            sudo docker push aashman1414/my-app-image:latest
            sudo docker logout
          EOF

      # Step 6: Configure AWS Credentials
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      # Step 7: Login to Amazon ECR
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      # Step 8: Pull Docker image from DockerHub
      - name: Pull Docker image from Docker Hub
        run: docker pull aashman1414/my-app-image:latest

      # Step 9: Tag image for ECR
      - name: Tag Docker image for ECR
        run: |
          ECR_REPOSITORY_URI="${{ secrets.ECR_REPOSITORY_URI }}"
          docker tag aashman141
